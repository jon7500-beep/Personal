<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>Pokemon Adventure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#1a1a2e;color:#fff;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;min-height:100dvh;overflow:hidden}
#app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;overflow:hidden}
button{cursor:pointer;border:none;font-family:inherit;font-size:16px;font-weight:700;border-radius:12px;padding:14px 20px;width:100%;transition:opacity .1s;-webkit-appearance:none}
button:active{opacity:.75}
.btn-red{background:#cc0000;color:#fff;border:2px solid #ff4444}
.btn-blue{background:#1a3a8e;color:#fff;border:2px solid #3366cc}
.btn-dark{background:#1f1f3a;color:#fff;border:2px solid #333}
.btn-green{background:#1a5c1a;color:#fff;border:2px solid #44aa44}
.btn-disabled{background:#333;color:#666;border:2px solid #444}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gold{color:#f8c800}
.red{color:#f83800}
.green{color:#44dd44}
.type-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;color:#fff;margin-right:4px}
.hp-track{height:8px;background:#333;border-radius:4px;overflow:hidden;border:1px solid #555}
.hp-fill{height:100%;border-radius:4px;transition:width .3s}
.xp-track{height:4px;background:#333;border-radius:2px;overflow:hidden;margin-top:4px}
.xp-fill{height:100%;background:#4080ff;border-radius:2px}
.screen{display:flex;flex-direction:column;height:100%;padding:16px;overflow-y:auto}
/* BATTLE LAYOUT */
.battle-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.battle-wild{background:linear-gradient(135deg,#c8e8b0,#e8f5d8);padding:12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.battle-player{background:linear-gradient(135deg,#b0c8e8,#d8eaf8);padding:12px;display:flex;align-items:center;flex-shrink:0}
.battle-ui{flex:1;background:#0d0d1f;display:flex;flex-direction:column;overflow:hidden}
.mon-name{font-size:17px;font-weight:800;color:#111}
.mon-level{font-size:12px;color:#555;margin-bottom:2px}
.hp-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.hp-label{font-size:11px;font-weight:700;color:#333;width:20px;flex-shrink:0}
.hp-bar-wrap{flex:1}
.hp-nums{font-size:12px;font-weight:700;margin-top:2px}
.status-badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700;color:#fff;margin-left:4px}
/* SPRITE */
.sprite{image-rendering:pixelated;image-rendering:crisp-edges}
/* MSG BOX */
.msg-box{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px;border-top:2px solid #333;cursor:pointer}
.msg-text{font-size:18px;font-weight:600;line-height:1.5;color:#fff}
.tap-hint{font-size:12px;color:#666;margin-top:10px;text-align:right}
/* MENU */
.menu-wrap{flex:1;display:flex;flex-direction:column;padding:12px;gap:8px;overflow:hidden}
.menu-prompt{font-size:14px;color:#ccc;margin-bottom:4px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.menu-btn{background:#1a2a5e;border:2px solid #334;border-radius:12px;color:#fff;font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;cursor:pointer}
.menu-btn:active{opacity:.7}
.menu-btn-icon{font-size:22px}
/* MOVE LIST */
.move-list{flex:1;display:flex;flex-direction:column;padding:10px;gap:8px;overflow:hidden}
.move-btn{background:#141428;border:2px solid #555;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center}
.move-btn:active{opacity:.7}
.move-btn.depleted{opacity:.35}
.move-name{font-size:14px;font-weight:700;color:#fff}
.move-meta{font-size:11px;color:#aaa}
/* PARTY ROWS */
.party-row{background:#141428;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:10px;border:1px solid #2a2a55}
.party-row.fainted{opacity:.4}
/* AREA PICKER */
.area-opt{padding:14px 8px;border-bottom:1px solid #222;display:flex;justify-content:space-between;cursor:pointer}
.area-opt:active{background:#2a2a45}
.area-opt.locked{opacity:.35;cursor:default}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:100}
.modal-box{background:#1a1a2e;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;max-width:480px;margin:0 auto}
</style>

// ─── UTILS ─────────────────────────────────────────────────────────────────
function calcStat(base,lv,isHP){return isHP?Math.floor((base*2*lv)/100)+lv+10:Math.floor((base*2*lv)/100)+5;}
function xpForLv(lv){return Math.floor(Math.pow(lv,3));}

function createMon(dexId,lv){
  const db=POKEMON_DB[dexId];
  const stats={hp:calcStat(db.bs.hp,lv,true),atk:calcStat(db.bs.atk,lv,false),def:calcStat(db.bs.def,lv,false),spa:calcStat(db.bs.spa,lv,false),spd:calcStat(db.bs.spd,lv,false),spe:calcStat(db.bs.spe,lv,false)};
  const moves=db.moves.map(id=>({...MOVES[id],cur:MOVES[id].pp}));
  return{dexId,name:db.name,types:[...db.types],lv,stats,hp:stats.hp,status:null,stTurns:0,moves,cr:db.cr,xpY:db.xp,xp:xpForLv(lv),xpNext:xpForLv(lv+1),stg:{atk:0,def:0,spa:0,spd:0,spe:0,acc:0}};
}

function stageMult(s){const t=[.25,.28,.33,.4,.5,.66,1,1.5,2,2.5,3,3.5,4];return t[Math.max(0,Math.min(12,s+6))];}

function calcDmg(atk,def,move){
  if(!move.power||move.cat==='Status')return{dmg:0,tm:1,tt:null,crit:false};
  const isP=move.cat==='Physical';
  let a=isP?atk.stats.atk:atk.stats.spa;
  let d=isP?def.stats.def:def.stats.spd;
  a*=stageMult(isP?atk.stg.atk:atk.stg.spa);
  d*=stageMult(isP?def.stg.def:def.stg.spd);
  if(atk.status==='burn'&&isP)a*=.5;
  const tm=typeEffect(move.type,def.types);
  const stab=atk.types.includes(move.type)?1.5:1;
  const crit=Math.random()<(move.hc?1/8:1/16);
  const rng=(Math.floor(Math.random()*16)+85)/100;
  let dmg=Math.floor((((2*atk.lv*move.power*a)/d/50)+2)*stab*tm*(crit?1.5:1)*rng);
  dmg=tm===0?0:Math.max(1,dmg);
  return{dmg,tm,tt:typeText(tm),crit,drain:move.drain?Math.floor(dmg/2):0};
}

function hitCheck(move,atk,def){
  if(!move.acc)return true;
  return Math.random()*100<move.acc*stageMult(atk.stg.acc)*stageMult(-def.stg.acc??0);
}

function randomEnc(areaName){
  const a=AREAS[areaName];
  const tot=a.enc.reduce((s,e)=>s+e.w,0);
  let r=Math.random()*tot;
  for(const e of a.enc){r-=e.w;if(r<=0){const lv=a.min+Math.floor(Math.random()*(a.max-a.min+1));return createMon(e.d,lv);}}
  const last=a.enc[a.enc.length-1];
  return createMon(last.d,a.min);
}

function tryCatch(mon){
  const hpF=mon.hp/mon.stats.hp;
  const sb=(mon.status==='sleep'||mon.status==='freeze')?2:mon.status?1.5:1;
  return Math.random()*255<mon.cr*sb*(1-hpF*.7);
}

function hpColor(mon){const p=mon.hp/mon.stats.hp;return p>.5?'#44dd44':p>.25?'#f8c800':'#f83800';}
function hpPct(mon){return Math.max(0,Math.round((mon.hp/mon.stats.hp)*100))+'%';}

function statusLabel(s){return{burn:'BRN',poison:'PSN',paralysis:'PAR',sleep:'SLP',freeze:'FRZ',confusion:'CNF'}[s]||'';}
function statusColor(s){return{burn:'#e2621b',poison:'#a040a0',paralysis:'#f8c800',sleep:'#7088a0',freeze:'#98d8d8',confusion:'#f85888'}[s]||'#888';}

function spriteURL(id,front=true){
  return front?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`
              :`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/${id}.png`;
}

function typeBadge(t){return`<span class="type-badge" style="background:${TYPE_COLORS[t]||'#888'}">${t}</span>`;}

function save(){try{localStorage.setItem('pkm_save',JSON.stringify({playerName:G.playerName,party:G.party,bag:G.bag,area:G.area}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('pkm_save')||'null');if(!d)return false;G.playerName=d.playerName;G.party=d.party;G.bag=d.bag||{pokeballs:5};G.area=d.area||'Route 1';return true;}catch(e){return false;}}
function hasSave(){return!!localStorage.getItem('pkm_save');}

function healAll(){G.party=G.party.map(p=>({...p,hp:p.stats.hp,status:null,stTurns:0,moves:p.moves.map(m=>({...m,cur:m.pp}))}));}

// ─── NAVIGATION / ACTIONS ──────────────────────────────────────────────────
function go(action){
  switch(action){
    case 'new':
      G.playerName='';G.party=[];G.bag={pokeballs:5};G.area='Route 1';_chosen=null;
      G.screen='name';render();break;
    case 'continue':
      if(load()){G.screen='overworld';render();}break;
    case 'nameNext':{
      const n=document.getElementById('nameInput');
      const v=(n&&n.value||G.playerName).trim();
      if(!v){alert('Please enter your name!');return;}
      G.playerName=v;G.screen='starter';_chosen=null;render();break;}
    case 'startGame':
      if(!_chosen)return;
      G.party=[createMon(_chosen,5)];save();G.screen='overworld';render();break;
    case 'explore':{
      if(!G.party.some(p=>p.hp>0)){alert('All your Pokemon have fainted! Use Rest to heal them first.');return;}
      const w=randomEnc(G.area);
      const pClone=G.party.map(p=>JSON.parse(JSON.stringify(p)));
      const alive=pClone.findIndex(p=>p.hp>0);
      G.battle={wild:w,party:pClone,activeIdx:alive>=0?alive:0,phase:'reading',msgs:[`A wild ${w.name} appeared!`],msgIdx:0,pendingPhase:'menu',escAttempts:0};
      G.screen='battle';render();break;}
    case 'rest':
      if(confirm('Heal all Pokemon to full HP?')){healAll();save();render();}break;
    case 'save': save();alert('Game saved!');break;
    case 'healAll': healAll();save();render();break;
  }
}

function chooseStarter(id){_chosen=id;render();}
function selectArea(name){G.area=name;G.modal=null;render();}

// ─── BATTLE ACTIONS ────────────────────────────────────────────────────────
function b_phase(ph){if(G.battle){G.battle.phase=ph;render();}}

function advMsg(){
  const b=G.battle;
  if(!b)return;
  if(b.msgIdx<b.msgs.length-1){b.msgIdx++;render();}
  else{
    if(b.pendingPhase==='end'){endBattle();}
    else{b.phase=b.pendingPhase;b.msgs=[];b.msgIdx=0;render();}
  }
}

function pushMsgs(msgs,next){
  const b=G.battle;
  b.msgs=msgs;b.msgIdx=0;b.phase='reading';b.pendingPhase=next;render();
}

function endBattle(){
  const b=G.battle;
  // Sync party back
  if(b.endResult==='caught'){
    const caught=JSON.parse(JSON.stringify(b.wild));
    caught.hp=Math.max(1,Math.floor(b.wild.stats.hp*.3));
    caught.status=null;
    if(G.party.length<6)G.party.push(caught);
    else G.party=b.party.map(p=>JSON.parse(JSON.stringify(p)));
  } else if(b.endResult==='lost'){
    G.party=b.party.map(p=>({...p,hp:Math.max(1,Math.floor(p.stats.hp*.3)),status:null}));
  } else {
    G.party=b.party.map(p=>JSON.parse(JSON.stringify(p)));
  }
  save();
  G.battle=null;
  G.screen='overworld';render();
}

function applyStatStage(mon,stat,stages){
  const cur=mon.stg[stat]||0;
  mon.stg[stat]=Math.max(-6,Math.min(6,cur+stages));
  return mon;
}

function eotStatus(mon){
  const msgs=[];
  if(mon.status==='burn'||mon.status==='poison'){
    const d=Math.max(1,Math.floor(mon.stats.hp/8));
    mon.hp=Math.max(0,mon.hp-d);
    msgs.push(`${mon.name} is hurt by ${mon.status==='burn'?'its burn':'poison'}! (${d} dmg)`);
  }
  if(mon.status==='sleep'){mon.stTurns=(mon.stTurns||0)+1;if(mon.stTurns>=3){mon.status=null;mon.stTurns=0;msgs.push(`${mon.name} woke up!`);}}
  if(mon.status==='freeze'){if(Math.random()<.2){mon.status=null;msgs.push(`${mon.name} thawed out!`);}}
  return msgs;
}

function pickWildMove(mon){
  const usable=mon.moves.filter(m=>m.cur>0);
  const pool=usable.length?usable:mon.moves;
  return pool[Math.floor(Math.random()*pool.length)];
}

function executeMove(attacker,defender,move,msgs){
  // Status checks
  if(attacker.status==='paralysis'&&Math.random()<.25){msgs.push(`${attacker.name} is paralyzed and can't move!`);return false;}
  if(attacker.status==='sleep'){msgs.push(`${attacker.name} is fast asleep!`);return false;}
  if(attacker.status==='freeze'){msgs.push(`${attacker.name} is frozen solid!`);return false;}

  msgs.push(`${attacker.name} used ${move.name}!`);
  // Deduct PP
  const mi=attacker.moves.findIndex(m=>m.id===move.id);
  if(mi>=0)attacker.moves[mi].cur=Math.max(0,move.cur-1);

  if(move.cat==='Status'){
    const eff=move.eff;
    if(!eff){msgs.push('But nothing happened!');return true;}
    if(eff.k==='stat'){
      applyStatStage(eff.tgt==='foe'?defender:attacker,eff.stat,eff.stg);
      const target=eff.tgt==='foe'?defender:attacker;
      msgs.push(`${target.name}'s ${eff.stat.toUpperCase()} ${eff.stg>0?'rose':'fell'}!`);
    } else if(eff.k==='status'){
      if(!defender.status){defender.status=eff.status;msgs.push(`${defender.name} ${eff.status==='sleep'?'fell asleep':'was '+eff.status+'ed'}!`);}
      else msgs.push("But it had no effect!");
    }
    return true;
  }

  // Accuracy
  if(!hitCheck(move,attacker,defender)){msgs.push(`${defender.name} avoided the attack!`);return true;}

  const r=calcDmg(attacker,defender,move);
  if(r.tm===0){msgs.push('It had no effect!');return true;}
  if(r.crit)msgs.push('A critical hit!');
  if(r.tt)msgs.push(r.tt);
  defender.hp=Math.max(0,defender.hp-r.dmg);
  msgs.push(`${defender.name} took ${r.dmg} damage!`);
  if(r.drain){attacker.hp=Math.min(attacker.stats.hp,attacker.hp+r.drain);msgs.push(`${attacker.name} restored ${r.drain} HP!`);}

  const eff=move.eff;
  if(eff&&defender.hp>0){
    const roll=eff.ch?Math.random()*100<eff.ch:true;
    if(roll){
      if(eff.k==='status'&&!defender.status){defender.status=eff.status;msgs.push(`${defender.name} was ${eff.status}!`);}
      else if(eff.k==='stat'){applyStatStage(defender,eff.stat,eff.stg);msgs.push(`${defender.name}'s ${eff.stat.toUpperCase()} fell!`);}
    }
  }
  return true;
}

function b_move(moveId){
  const b=G.battle;
  if(!b||b.phase!=='fight')return;
  const p=b.party[b.activeIdx];
  const move=p.moves.find(m=>m.id===moveId);
  if(!move||move.cur===0)return;

  const msgs=[];
  const w=b.wild;

  executeMove(p,w,move,msgs);

  if(w.hp<=0){
    msgs.push(`${w.name} fainted!`);
    const xpGained=Math.max(1,Math.floor((w.xpY*w.lv)/7));
    msgs.push(`${p.name} gained ${xpGained} XP!`);
    p.xp=(p.xp||0)+xpGained;
    while(p.xp>=p.xpNext&&p.lv<100){
      p.lv++;const base=POKEMON_DB[p.dexId].bs;
      const ns={hp:calcStat(base.hp,p.lv,true),atk:calcStat(base.atk,p.lv,false),def:calcStat(base.def,p.lv,false),spa:calcStat(base.spa,p.lv,false),spd:calcStat(base.spd,p.lv,false),spe:calcStat(base.spe,p.lv,false)};
      p.hp=Math.min(ns.hp,p.hp+(ns.hp-p.stats.hp));p.stats=ns;p.xpNext=xpForLv(p.lv+1);
      msgs.push(`${p.name} grew to level ${p.lv}!`);
    }
    b.endResult='win';pushMsgs(msgs,'end');return;
  }

  // Wild turn
  const wMove=pickWildMove(w);
  executeMove(w,p,wMove,msgs);

  // EOT
  msgs.push(...eotStatus(p));
  msgs.push(...eotStatus(w));

  if(p.hp<=0){
    msgs.push(`${p.name} fainted!`);
    const next=b.party.findIndex((m,i)=>i!==b.activeIdx&&m.hp>0);
    if(next>=0){msgs.push(`Go, ${b.party[next].name}!`);b.activeIdx=next;pushMsgs(msgs,'menu');}
    else{msgs.push("You have no more Pokemon...");msgs.push("You blacked out!");b.endResult='lost';pushMsgs(msgs,'end');}
    return;
  }
  if(w.hp<=0){msgs.push(`${w.name} fainted!`);b.endResult='win';pushMsgs(msgs,'end');return;}

  pushMsgs(msgs,'menu');
}

function b_bag(){
  const b=G.battle;
  if(G.bag.pokeballs<=0){pushMsgs(["You're out of Poke Balls!"],'menu');return;}
  G.bag.pokeballs--;
  const caught=tryCatch(b.wild);
  if(caught){b.endResult='caught';pushMsgs([`You threw a Poke Ball...`,'...','...','Gotcha! '+b.wild.name+' was caught!'],'end');}
  else{pushMsgs([`You threw a Poke Ball...`,b.wild.name+' broke free!'],'menu');}
}

function b_run(){
  const b=G.battle;
  b.escAttempts=(b.escAttempts||0)+1;
  const p=b.party[b.activeIdx];
  const fled=p.stats.spe>=b.wild.stats.spe||Math.random()*256<Math.floor((p.stats.spe*128)/b.wild.stats.spe)+30*b.escAttempts;
  if(fled){b.endResult='run';pushMsgs(['Got away safely!'],'end');}
  else{pushMsgs(["Can't escape!"],'menu');}
}

function b_switch(idx){
  const b=G.battle;
  if(idx===b.activeIdx)return;
  if(b.party[idx].hp<=0)return;
  b.activeIdx=idx;b.phase='menu';render();
}

// ─── EVENT BINDING ─────────────────────────────────────────────────────────
function bindEvents(){
  // Handle enter key on name input
  const ni=document.getElementById('nameInput');
  if(ni){ni.focus();ni.addEventListener('keydown',e=>{if(e.key==='Enter')go('nameNext');});}
}

// ─── BOOT ──────────────────────────────────────────────────────────────────
render();
</script>
