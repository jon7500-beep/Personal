<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a3a1a">
<title>Pokemon Adventure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;touch-action:none}
#app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
button{cursor:pointer;border:none;font-family:inherit;font-size:16px;font-weight:700;border-radius:12px;padding:14px 20px;width:100%;-webkit-appearance:none;transition:opacity .08s}
button:active{opacity:.7}
.btn-red{background:#cc0000;color:#fff;border:2px solid #ff4444}
.btn-blue{background:#1a3a8e;color:#fff;border:2px solid #3366cc}
.btn-dark{background:#1f1f3a;color:#fff;border:2px solid #333}
.btn-green{background:#1a5c1a;color:#fff;border:2px solid #44aa44}
.btn-gold{background:#8a6a00;color:#f8c800;border:2px solid #f8c800}
.btn-disabled{background:#333;color:#666;border:2px solid #444}
.screen{display:flex;flex-direction:column;height:100%;padding:16px;overflow-y:auto}
.gold{color:#f8c800}.red{color:#f83800}.green{color:#44dd44}
.hp-track{height:8px;background:#333;border-radius:4px;overflow:hidden;border:1px solid #444}
.hp-fill{height:100%;border-radius:4px;transition:width .3s}
.xp-track{height:4px;background:#333;border-radius:2px;overflow:hidden;margin-top:3px}
.xp-fill{height:100%;background:#4080ff;border-radius:2px}
.type-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;margin-right:3px}
.status-badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700;color:#fff;margin-left:4px}
/* ── BATTLE ── */
.battle-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.battle-scene{position:relative;flex-shrink:0;overflow:hidden}
.battle-wild-info{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px)}
.battle-player-info{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);border-radius:12px;padding:8px 12px;text-align:right;backdrop-filter:blur(4px)}
.battle-ui{flex:1;background:#0d0d1f;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.mon-name{font-size:16px;font-weight:800;color:#fff}
.mon-level{font-size:11px;color:#bbb;margin-bottom:2px}
.msg-box{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 20px;border-top:2px solid #333;cursor:pointer;min-height:0}
.msg-text{font-size:17px;font-weight:600;line-height:1.5;color:#fff}
.tap-hint{font-size:11px;color:#555;margin-top:8px;text-align:right}
.menu-wrap{flex:1;display:flex;flex-direction:column;padding:10px;gap:6px;overflow:hidden}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;max-height:160px}
.menu-btn{background:#1a2a5e;border:2px solid #334;border-radius:12px;color:#fff;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.menu-btn:active{opacity:.7}
.move-list{flex:1;display:flex;flex-direction:column;padding:8px;gap:6px;overflow:hidden}
.move-btn{background:#141428;border:2px solid #555;border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.move-btn:active{opacity:.7}
.move-btn.depleted{opacity:.35}
/* ── OVERWORLD ── */
#ow-wrap{position:relative;width:100%;height:100%;background:#1a3a1a;overflow:hidden;touch-action:none}
#ow-canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ow-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:10;pointer-events:none}
#ow-hud .hud-btn{pointer-events:all;cursor:pointer;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:4px 10px;color:#fff;font-size:13px;font-weight:700}
#ow-btns{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px;z-index:10;pointer-events:none}
.dpad{display:grid;grid-template-columns:40px 40px 40px;grid-template-rows:40px 40px 40px;gap:2px;pointer-events:all}
.dpad-btn{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#fff;touch-action:none}
.dpad-btn:active,.dpad-btn.pressed{background:rgba(255,255,255,.45)}
.dpad-center{background:rgba(255,255,255,.1) !important;cursor:default}
.action-btns{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:all}
.action-btn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;cursor:pointer;border:3px solid rgba(255,255,255,.4)}
#ow-dialog{position:absolute;bottom:120px;left:10px;right:10px;background:rgba(0,0,0,.88);border:2px solid #f8c800;border-radius:14px;padding:14px;z-index:20;cursor:pointer;display:none}
/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;z-index:100}
.modal-box{background:#1a1a2e;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;max-width:480px;margin:0 auto}
/* ── SHOP ── */
.shop-item{background:#141428;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border:1px solid #333}
/* ── PARTY ── */
.party-row{background:#141428;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:10px;border:1px solid #2a2a55}
.party-row.fainted{opacity:.4}
/* ── FLASH ANIMATION ── */
@keyframes flash{0%,100%{opacity:1}50%{opacity:0}}
.flash{animation:flash .25s 2}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
@keyframes hitPop{0%{transform:scale(1.3);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes legGlow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.leg-glow{animation:legGlow 1.8s ease-in-out infinite}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

// ══════════════════════════════════════════════════════
//  AUDIO ENGINE
// ══════════════════════════════════════════════════════
let _actx = null;
let _masterGain = null;
let _muted = false;
let _musicTrack = null;
let _musicTimeout = null;

function getACtx() {
  if (!_actx) {
    _actx = new (window.AudioContext || window.webkitAudioContext)();
    _masterGain = _actx.createGain();
    _masterGain.gain.value = 0.25;
    _masterGain.connect(_actx.destination);
  }
  if (_actx.state === 'suspended') _actx.resume();
  return _actx;
}

function _note(freq, start, dur, type='square', vol=0.15) {
  if (_muted || !_actx) return;
  const osc = _actx.createOscillator();
  const g = _actx.createGain();
  osc.connect(g); g.connect(_masterGain);
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur * 0.88);
  osc.start(start); osc.stop(start + dur + 0.01);
}

// Note frequencies
const Hz = {
  A2:110,B2:123.5,C3:130.8,D3:146.8,E3:164.8,F3:174.6,G3:196,A3:220,B3:246.9,
  C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,B4:493.9,
  C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784,A5:880,
  __:0
};

function stopMusic() {
  _musicTrack = null;
  clearTimeout(_musicTimeout);
  _musicTimeout = null;
}

function _scheduleNotes(notes, bpm, offset=0) {
  const beat = 60/bpm;
  const now = _actx.currentTime + 0.05 + offset;
  let t = now, total = 0;
  for (const n of notes) {
    if (n[0] > 0) _note(n[0], t, beat*n[1], n[2]||'square', n[3]||0.13);
    t += beat*n[1]; total += beat*n[1];
  }
  return total;
}

const OW_MELODY = [
  [Hz.G4,.5],[Hz.E4,.5],[Hz.G4,.5],[Hz.A4,.5],
  [Hz.B4,.5],[Hz.A4,.25],[Hz.G4,.25],[Hz.E4,.5],
  [Hz.D4,.25],[Hz.E4,.25],[Hz.G4,1],
  [Hz.A4,.5],[Hz.G4,.25],[Hz.F4,.25],[Hz.G4,.5],
  [Hz.A4,.5],[Hz.F4,.25],[Hz.E4,.25],[Hz.D4,.25],[Hz.C4,.25],[Hz.D4,1],
  [Hz.E4,.5],[Hz.G4,.5],[Hz.A4,.5],[Hz.B4,.5],
  [Hz.G4,.5],[Hz.E4,.25],[Hz.D4,.25],[Hz.E4,.5],
  [Hz.C4,.25],[Hz.E4,.25],[Hz.G4,1.5],
];
const OW_BASS = [
  [Hz.C3,1,'triangle',.08],[Hz.G3,1,'triangle',.08],[Hz.C3,1,'triangle',.08],[Hz.G3,1,'triangle',.08],
  [Hz.F3,1,'triangle',.08],[Hz.C3,1,'triangle',.08],[Hz.G3,1,'triangle',.08],[Hz.G3,1,'triangle',.08],
  [Hz.A3,1,'triangle',.08],[Hz.E3,1,'triangle',.08],[Hz.F3,1,'triangle',.08],[Hz.G3,1,'triangle',.08],
];
const BATTLE_MELODY = [
  [Hz.E4,.25],[Hz.E4,.25],[Hz.__,.12],[Hz.E4,.25],
  [Hz.C4,.25],[Hz.E4,.5],[Hz.G4,.75],[Hz.__,.25],[Hz.G3,.75],
  [Hz.A4,.5],[Hz.B4,.5],[Hz.A4,.25],[Hz.G4,.5],
  [Hz.E5,.375],[Hz.G5,.375],[Hz.A5,.5],
  [Hz.F5,.375],[Hz.G5,.25],[Hz.E5,.375],[Hz.C5,.25],[Hz.D5,.25],[Hz.B4,.5],
];
const BATTLE_BASS = [
  [Hz.A2,.5,'triangle',.1],[Hz.A2,.5,'triangle',.1],
  [Hz.G3,.5,'triangle',.1],[Hz.G3,.5,'triangle',.1],
  [Hz.A2,.5,'triangle',.1],[Hz.A2,.5,'triangle',.1],
  [Hz.E3,.5,'triangle',.1],[Hz.F3,.5,'triangle',.1],
];

function playMusic(track) {
  stopMusic();
  getACtx();
  if (_muted) { _musicTrack = track; return; }
  _musicTrack = track;
  if (track === 'overworld') _loopOW();
  else if (track === 'battle') _loopBattle();
}

function _loopOW() {
  if (_musicTrack !== 'overworld') return;
  const dur = _scheduleNotes(OW_MELODY, 130);
  _scheduleNotes(OW_BASS, 130);
  _musicTimeout = setTimeout(_loopOW, (dur - 0.15) * 1000);
}

function _loopBattle() {
  if (_musicTrack !== 'battle') return;
  const dur = _scheduleNotes(BATTLE_MELODY, 158);
  _scheduleNotes(BATTLE_BASS, 158);
  _musicTimeout = setTimeout(_loopBattle, (dur - 0.15) * 1000);
}

function toggleMute() {
  _muted = !_muted;
  if (_masterGain) _masterGain.gain.value = _muted ? 0 : 0.25;
  if (!_muted && _musicTrack) { const t=_musicTrack; stopMusic(); playMusic(t); }
  const btn = document.getElementById('mute-btn');
  if (btn) btn.textContent = _muted ? '🔇' : '🔊';
}

const SFX = {
  _play(fn) { try { getACtx(); fn(_actx); } catch(e){} },
  hit()     { this._play(c=>{ const o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(_masterGain); o.type='square'; o.frequency.setValueAtTime(220,c.currentTime); o.frequency.exponentialRampToValueAtTime(80,c.currentTime+.12); g.gain.setValueAtTime(.25,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.15); o.start();o.stop(c.currentTime+.16); }); },
  select()  { if(_muted)return; _note(Hz.C5,_actx.currentTime,.06,'square',.1); _note(Hz.E5,_actx.currentTime+.07,.06,'square',.1); },
  catch_()  { if(_muted)return; [Hz.C4,Hz.E4,Hz.G4,Hz.C5].forEach((f,i)=>_note(f,_actx.currentTime+i*.1,.18,'square',.12)); },
  levelUp() { if(_muted)return; [Hz.C4,Hz.E4,Hz.G4,Hz.C5,Hz.E5,Hz.G5].forEach((f,i)=>_note(f,_actx.currentTime+i*.08,.12,'square',.1)); },
  victory() { stopMusic(); if(_muted)return; getACtx(); [[Hz.C4,.15],[Hz.C4,.15],[Hz.C4,.15],[Hz.G4,.6],[Hz.E4,.6],[Hz.C4,.15],[Hz.E4,.15],[Hz.G4,.8]].forEach(([f,d],i,a)=>{ const t=_actx.currentTime+a.slice(0,i).reduce((s,x)=>s+x[1],0); _note(f,t,d,'square',.15); }); },
  step()    { if(_muted)return; this._play(c=>{ const o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(_masterGain); o.type='triangle'; o.frequency.value=80+Math.random()*30; g.gain.setValueAtTime(.06,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.05); o.start();o.stop(c.currentTime+.06); }); },
  heal()    { if(_muted)return; [Hz.G4,Hz.A4,Hz.B4,Hz.C5].forEach((f,i)=>_note(f,_actx.currentTime+i*.1,.2,'triangle',.1)); },
  buy()     { if(_muted)return; _note(Hz.G5,_actx.currentTime,.1,'square',.1); _note(Hz.C5,_actx.currentTime+.12,.2,'square',.1); },
  legendary(){ if(_muted)return; getACtx(); [Hz.B3,Hz.E4,Hz.G4,Hz.B4,Hz.E5].forEach((f,i)=>_note(f,_actx.currentTime+i*.14,.4,'triangle',.14)); setTimeout(()=>{ if(!_muted) [Hz.A4,Hz.C5,Hz.E5,Hz.A5].forEach((f,i)=>_note(f,_actx.currentTime+i*.1,.3,'square',.12)); },800); },
  typeHit(type){
    if(_muted)return; getACtx(); const t=_actx.currentTime;
    const map={Fire:[220,180,.18,'sawtooth'],Water:[320,280,.14,'sine'],Electric:[880,440,.1,'square'],Grass:[260,200,.13,'triangle'],Ice:[520,480,.12,'sine'],Fighting:[110,80,.2,'square'],Psychic:[660,440,.1,'sine'],Ghost:[180,100,.15,'triangle'],Ground:[80,40,.22,'sawtooth'],Rock:[160,100,.2,'square'],Flying:[440,330,.1,'sine'],Normal:[200,160,.12,'square']};
    const [f1,f2,vol,wave]=map[type]||map.Normal;
    const o=_actx.createOscillator(),g=_actx.createGain(); o.connect(g);g.connect(_masterGain);
    o.type=wave; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+.14);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.start(t); o.stop(t+.2);
    if(type==='Electric'){ const o2=_actx.createOscillator(),g2=_actx.createGain(); o2.connect(g2);g2.connect(_masterGain); o2.type='square'; o2.frequency.value=220; g2.gain.setValueAtTime(.08,t+.04); g2.gain.exponentialRampToValueAtTime(.001,t+.1); o2.start(t+.04);o2.stop(t+.12); }
    if(type==='Fire'){ const o2=_actx.createOscillator(),g2=_actx.createGain(); o2.connect(g2);g2.connect(_masterGain); o2.type='sawtooth'; o2.frequency.value=110+Math.random()*40; g2.gain.setValueAtTime(.06,t+.06); g2.gain.exponentialRampToValueAtTime(.001,t+.16); o2.start(t+.06);o2.stop(t+.18); }
  },
};

// ══════════════════════════════════════════════════════
//  TYPE CHART
// ══════════════════════════════════════════════════════
const TC={Normal:{Rock:.5,Ghost:0,Steel:.5},Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5},Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},Ice:{Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2},Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0},Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},Bug:{Fire:.5,Grass:2,Fighting:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5},Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5},Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5},Dragon:{Dragon:2,Steel:.5},Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Steel:.5},Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5}};
function typeEff(at,dts){let m=1;for(const t of dts){const v=TC[at]?.[t];if(v!==undefined)m*=v;}return m;}
function typeText(m){return m===0?'It had no effect!':m>=2?"It's super effective!":m<=.5?"It's not very effective...":null;}
const TC_COLOR={Normal:'#a8a878',Fire:'#e2621b',Water:'#4a90d9',Grass:'#5db85a',Electric:'#f8c800',Ice:'#98d8d8',Fighting:'#c03028',Poison:'#a040a0',Ground:'#e0c068',Flying:'#a890f0',Psychic:'#f85888',Bug:'#a8b820',Rock:'#b8a038',Ghost:'#705898',Dragon:'#7038f8',Dark:'#705848',Steel:'#b8b8d0'};

// ══════════════════════════════════════════════════════
//  MOVES & POKEMON DATA

function calcStat(b,lv,isHP){return isHP?Math.floor((b*2*lv)/100)+lv+10:Math.floor((b*2*lv)/100)+5;}
function xpForLv(lv){return Math.floor(Math.pow(lv,3));}

function createMon(dexId, lv) {
  const db = PDB[dexId];
  const stats = {hp:calcStat(db.bs.hp,lv,true),atk:calcStat(db.bs.atk,lv,false),def:calcStat(db.bs.def,lv,false),spa:calcStat(db.bs.spa,lv,false),spd:calcStat(db.bs.spd,lv,false),spe:calcStat(db.bs.spe,lv,false)};
  return {dexId,name:db.name,types:[...db.types],lv,stats,hp:stats.hp,status:null,stTurns:0,moves:db.moves.map(id=>({...MOVES[id],cur:MOVES[id].pp})),cr:db.cr,xpY:db.xp,xp:xpForLv(lv),xpNext:xpForLv(lv+1),stg:{atk:0,def:0,spa:0,spd:0,spe:0,acc:0}};
}

function stgM(s){return [.25,.28,.33,.4,.5,.66,1,1.5,2,2.5,3,3.5,4][Math.max(0,Math.min(12,s+6))];}

function calcDmg(atk, def, move) {
  if (!move.power || move.cat==='Status') return {dmg:0,tm:1,tt:null,crit:false,drain:0};
  const isP = move.cat==='Physical';
  let a = (isP?atk.stats.atk:atk.stats.spa) * stgM(isP?atk.stg.atk:atk.stg.spa);
  let d = (isP?def.stats.def:def.stats.spd) * stgM(isP?def.stg.def:def.stg.spd);
  if (atk.status==='burn'&&isP) a*=.5;
  const tm = typeEff(move.type, def.types);
  const stab = atk.types.includes(move.type)?1.5:1;
  const crit = Math.random()<(move.hc?1/8:1/16);
  const rng = (Math.floor(Math.random()*16)+85)/100;
  const dmg = tm===0 ? 0 : Math.max(1, Math.floor((((2*atk.lv*move.power*a)/d/50)+2)*stab*tm*(crit?1.5:1)*rng));
  return {dmg, tm, tt:typeText(tm), crit, drain:move.drain?Math.floor(dmg/2):0};
}

function hitCheck(move, atk, def) {
  return !move.acc || Math.random()*100 < move.acc * stgM(atk.stg.acc) * stgM(-(def.stg.acc||0));
}

function randEnc(areaName) {
  const a = AREAS[areaName];
  const tot = a.enc.reduce((s,e)=>s+e.w,0);
  let r = Math.random()*tot;
  for (const e of a.enc) { r-=e.w; if(r<=0) return createMon(e.d, a.min+Math.floor(Math.random()*(a.max-a.min+1))); }
  return createMon(a.enc[a.enc.length-1].d, a.min);
}

function tryCatch(mon) {
  const sb = (mon.status==='sleep'||mon.status==='freeze')?2:mon.status?1.5:1;
  return Math.random()*255 < mon.cr*sb*(1-(mon.hp/mon.stats.hp)*.7);
}

function hpColor(mon){const p=mon.hp/mon.stats.hp;return p>.5?'#44dd44':p>.25?'#f8c800':'#f83800';}
function hpPct(mon){return Math.max(0,Math.round((mon.hp/mon.stats.hp)*100))+'%';}

const SCLR={burn:'#e2621b',poison:'#a040a0',paralysis:'#f8c800',sleep:'#7088a0',freeze:'#98d8d8',confusion:'#f85888'};
function tbadge(t){return`<span class="type-badge" style="background:${TC_COLOR[t]||'#888'}">${t}</span>`;}
function sbadge(s){return s?`<span class="status-badge" style="background:${SCLR[s]||'#888'}">${SLBL[s]||''}</span>`:''}
function spr(id,front=true){return front?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`:`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/${id}.png`;}

function loadGame(){try{const d=JSON.parse(localStorage.getItem('pkm2')||'null');if(!d)return false;G.playerName=d.playerName;G.party=d.party;G.bag=d.bag||{pokeballs:15,potions:5,gold:10000};G.area=d.area||'Route 1';G.caught=d.caught||{};if(d.owX!=null)OW.player.tx=d.owX;if(d.owY!=null)OW.player.ty=d.owY;return true;}catch(e){return false;}}
function hasSave(){return!!localStorage.getItem('pkm2');}
function healAll(){G.party=G.party.map(p=>({...p,hp:p.stats.hp,status:null,stTurns:0,moves:p.moves.map(m=>({...m,cur:m.pp}))}));}
function deepClone(o){return JSON.parse(JSON.stringify(o));}
function addGold(amt){G.bag.gold=(G.bag.gold||0)+amt;}

const OW = {

  player: { tx:7, ty:6, px:0, py:0, dir:'down', moving:false, stepF:0, walkCycle:0, targetTX:7, targetTY:6 },

  dialogNPC: null, dialogLine: 0,
};

function owInit() {
  OW.player.px = OW.player.tx * OW.ts;
  OW.player.py = OW.player.ty * OW.ts;
}

function owStart() {
  if (OW.rafId) return;
  function loop() { owUpdate(); owDraw(); OW.rafId = requestAnimationFrame(loop); }
  OW.rafId = requestAnimationFrame(loop);
}

function owStop() {
  if (OW.rafId) { cancelAnimationFrame(OW.rafId); OW.rafId = null; }
  clearTimeout(OW.holdTimer); OW.holdTimer = null;
}

function owTile(tx, ty) {
  if (tx<0||ty<0||tx>=MAP_COLS||ty>=MAP_ROWS) return 2;
  return MAP_DATA[ty][tx];
}

function owBlocked(tx, ty) {
  const t = owTile(tx, ty);
  if (t===2||t===3||t===4) return true;
  // NPC occupies tile
  for (const n of NPCS) if (n.tx===tx && n.ty===ty) return true;
  return false;
}

function owTryMove(dx, dy) {
  if (OW.player.moving) return;
  const nx = OW.player.tx+dx, ny = OW.player.ty+dy;
  const dir = dx>0?'right':dx<0?'left':dy>0?'down':'up';
  OW.player.dir = dir;
  // Face NPC check
  for (const n of NPCS) {
    if (n.tx===nx && n.ty===ny) { owDraw(); return; } // face them but don't move
  }
  if (owBlocked(nx,ny)) return;
  // Check building entry
  const t = owTile(nx,ny);
  if (t===8) { owEnterPC(); return; }
  if (t===9) { saveGame(); G.screen='shop'; owStop(); render(); return; }
  OW.player.targetTX=nx; OW.player.targetTY=ny;
  OW.player.moving=true; OW.player.stepF=0;
}

function owEnterPC() {
  if (OW.dialogData) return;
  healAll(); SFX.heal(); saveGame();
  owShowDialog('POKEMON CENTER', ['Welcome! Your Pokemon have been healed to full health!','Progress saved ✓  Come back anytime.'], null, ()=>owCloseDialog());
}

function owUpdate() {
  const p = OW.player;
  if (!p.moving) return;
  const speed = 4; // px per frame
  p.stepF++;
  const progress = Math.min(1, p.stepF / (OW.ts / speed));
  const sx = p.tx * OW.ts, sy = p.ty * OW.ts;
  const ex = p.targetTX * OW.ts, ey = p.targetTY * OW.ts;
  p.px = sx + (ex-sx)*progress;
  p.py = sy + (ey-sy)*progress;
  if (progress >= 1) {
    p.tx = p.targetTX; p.ty = p.targetTY;
    p.px = ex; p.py = ey;
    p.moving = false; p.stepF = 0;
    p.walkCycle++;
    if (p.walkCycle % 2 === 0) SFX.step();
    owOnArrive();
  }
}

function owOnArrive() {
  if (OW.player.walkCycle % 15 === 0) saveGame();
  const tx=OW.player.tx, ty=OW.player.ty;
  // Legendary encounter
  for (const leg of LEGENDARIES) {
    if (leg.tx===tx && leg.ty===ty && !G.caught[leg.dexId]) {
      owStop();
      SFX.legendary();
      const wild = createMon(leg.dexId, leg.lv);
      wild.cr = 5; // slightly easier to catch
      G.battle = {wild, party:G.party.map(deepClone), activeIdx:G.party.findIndex(p=>p.hp>0), escAttempts:0, endResult:null, msgs:[], msgIdx:0, phase:'reading', pendingPhase:'menu', isLegendary:true};
      G.battle.msgs = [`✨ A wild ${wild.name} appeared! ✨`, `This is a legendary encounter!`, `It's incredibly powerful!`];
      G.screen = 'battle'; playMusic('battle'); render(); return;
    }
  }
  const t = owTile(tx, ty);
  if (t===1 && Math.random()<0.2) {
    owStop();
    const wild = randEnc(G.area);
    G.battle = {wild, party:G.party.map(deepClone), activeIdx:G.party.findIndex(p=>p.hp>0), escAttempts:0, endResult:null, msgs:[], msgIdx:0, phase:'reading', pendingPhase:'menu'};
    G.battle.msgs = [`A wild ${wild.name} appeared!`];
    G.screen = 'battle'; playMusic('battle'); render();
  }
}

function owAction() {
  // Check NPC in facing direction
  const p = OW.player;
  const dx = p.dir==='right'?1:p.dir==='left'?-1:0;
  const dy = p.dir==='down'?1:p.dir==='up'?-1:0;
  const fx=p.tx+dx, fy=p.ty+dy;
  for (const n of NPCS) {
    if (n.tx===fx && n.ty===fy) {
      OW.dialogNPC = n; OW.dialogLine = 0;
      owShowDialog(n.name, n.lines, n, ()=>owCloseDialog());
      return;
    }
  }
  // Check sign
  if (owTile(fx,fy)===5) {
    owShowDialog('Sign', ['Welcome to Pallet Town!','Head south into the tall grass to find wild Pokemon.'], null, ()=>owCloseDialog());
  }
}

function owShowDialog(title, lines, npc, onDone) {
  OW.dialogData = {title, lines, idx:0, onDone};
  const el = document.getElementById('ow-dialog');
  if (!el) return;
  el.style.display = 'block';
  owUpdateDialog();
}

function owUpdateDialog() {
  const d = OW.dialogData;
  if (!d) return;
  const el = document.getElementById('ow-dialog');
  if (!el) return;
  el.innerHTML = `<div style="color:#f8c800;font-size:12px;font-weight:800;margin-bottom:4px">${d.title}</div><div style="color:#fff;font-size:15px;line-height:1.4">${d.lines[d.idx]}</div><div style="color:#666;font-size:11px;margin-top:8px;text-align:right">▼ tap</div>`;
}

function owAdvanceDialog() {
  const d = OW.dialogData;
  if (!d) return;
  d.idx++;
  if (d.idx >= d.lines.length) { d.onDone(); }
  else owUpdateDialog();
}

function owCloseDialog() {
  const el = document.getElementById('ow-dialog');
  if (el) el.style.display = 'none';
  OW.dialogData = null;
}

// ── CANVAS DRAW ──
function owDraw() {
  const c = OW.canvas, ctx = OW.ctx;
  if (!c||!ctx) return;
  const ts = OW.ts;
  const p = OW.player;

  // Camera: center on player pixel pos
  const camX = p.px - c.width/2 + ts/2;
  const camY = p.py - c.height/2 + ts/2;

  ctx.clearRect(0,0,c.width,c.height);

  // Draw tiles
  const startTX = Math.max(0, Math.floor(camX/ts));
  const endTX   = Math.min(MAP_COLS-1, Math.ceil((camX+c.width)/ts));
  const startTY = Math.max(0, Math.floor(camY/ts));
  const endTY   = Math.min(MAP_ROWS-1, Math.ceil((camY+c.height)/ts));

  for (let ty=startTY; ty<=endTY; ty++) {
    for (let tx=startTX; tx<=endTX; tx++) {
      const sx = tx*ts - camX, sy = ty*ts - camY;
      drawTile(ctx, owTile(tx,ty), sx, sy, ts);
    }
  }

  // Draw NPCs
  for (const n of NPCS) {
    const sx = n.tx*ts - camX, sy = n.ty*ts - camY;
    if (sx>-ts&&sx<c.width&&sy>-ts&&sy<c.height) drawNPC(ctx, n, sx, sy, ts);
  }

  // Draw legendaries
  for (const leg of LEGENDARIES) {
    if (G.caught[leg.dexId]) continue;
    const sx=leg.tx*ts-camX, sy=leg.ty*ts-camY;
    if (sx>-ts&&sx<c.width&&sy>-ts&&sy<c.height) drawLegendary(ctx, leg, sx, sy, ts);
  }

  // Draw player
  drawPlayer(ctx, p.px-camX, p.py-camY, p.dir, p.walkCycle, ts);
}

function drawTile(ctx, type, sx, sy, ts) {
  // Base fill per type
  const bases={0:'#c9a85c',1:'#2e8a2e',2:'#346034',3:'#2858b0',4:'#c8c8d8',5:'#c9a85c',6:'#4cb04c',7:'#58b858',8:'#d0c0d8',9:'#c0c0e0'};
  ctx.fillStyle = bases[type] || '#888';
  ctx.fillRect(sx, sy, ts, ts);

  if (type===0) {
    // Dirt path with texture
    ctx.fillStyle='#d8b870'; ctx.fillRect(sx+1,sy+1,ts-2,ts-2);
    ctx.fillStyle='rgba(100,70,20,.18)';
    [[.18,.28],[.72,.18],[.42,.72],[.82,.58],[.12,.82],[.62,.38],[.52,.12]].forEach(([rx,ry])=>{
      ctx.beginPath(); ctx.arc(sx+rx*ts,sy+ry*ts,ts*.045,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle='rgba(255,255,255,.08)';
    ctx.fillRect(sx,sy,ts,ts*.3);
  } else if (type===7) {
    // Lawn — bright green with subtle blades
    ctx.fillStyle='#64c264'; ctx.fillRect(sx,sy,ts,ts);
    ctx.fillStyle='rgba(50,160,50,.35)';
    for(let i=0;i<5;i++){ ctx.fillRect(sx+ts*(.08+i*.18),sy+ts*.5,ts*.05,ts*.3); }
    ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fillRect(sx,sy,ts,ts*.25);
  } else if (type===1) {
    // Tall grass — layered blades
    ctx.fillStyle='#267826'; ctx.fillRect(sx,sy,ts,ts);
    ctx.fillStyle='#185018';
    for(let i=0;i<5;i++){ const bx=sx+ts*(.06+i*.18); ctx.fillRect(bx,sy+ts*.06,ts*.1,ts*.62); }
    ctx.fillStyle='#50c050';
    for(let i=0;i<5;i++){ const bx=sx+ts*(.08+i*.18); ctx.fillRect(bx,sy+ts*.06,ts*.04,ts*.22); }
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(sx,sy+ts*.7,ts,ts*.3);
  } else if (type===2) {
    // Tree — multi-layer foliage
    ctx.fillStyle='#2e6030'; ctx.fillRect(sx,sy,ts,ts);
    // Trunk
    ctx.fillStyle='#8a6228'; ctx.fillRect(sx+ts*.38,sy+ts*.55,ts*.24,ts*.45);
    ctx.fillStyle='#a87840'; ctx.fillRect(sx+ts*.4,sy+ts*.58,ts*.1,ts*.38);
    // Shadow under canopy
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(sx+ts*.5,sy+ts*.62,ts*.33,ts*.09,0,0,Math.PI*2); ctx.fill();
    // Canopy layers (dark → bright)
    ctx.fillStyle='#165016';
    ctx.beginPath(); ctx.arc(sx+ts*.5,sy+ts*.4,ts*.39,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#267826';
    ctx.beginPath(); ctx.arc(sx+ts*.5,sy+ts*.33,ts*.32,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3a9a3a';
    ctx.beginPath(); ctx.arc(sx+ts*.42,sy+ts*.26,ts*.24,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+ts*.62,sy+ts*.29,ts*.18,0,Math.PI*2); ctx.fill();
    // Top highlight
    ctx.fillStyle='#52b852';
    ctx.beginPath(); ctx.arc(sx+ts*.44,sy+ts*.2,ts*.14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.arc(sx+ts*.4,sy+ts*.17,ts*.08,0,Math.PI*2); ctx.fill();
  } else if (type===3) {
    // Water — gradient + waves
    ctx.fillStyle='#1c50a8'; ctx.fillRect(sx,sy,ts,ts);
    ctx.fillStyle='#2870c8'; ctx.fillRect(sx,sy,ts,ts*.55);
    ctx.fillStyle='#3888d8'; ctx.fillRect(sx,sy,ts,ts*.2);
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1.4; ctx.lineCap='round';
    [[.05,.34,.28,.22,.58,.38,.95,.3],[.05,.65,.22,.55,.56,.68,.95,.6]].forEach(([x1,y1,x2,y2,x3,y3,x4,y4])=>{
      ctx.beginPath(); ctx.moveTo(sx+ts*x1,sy+ts*y1); ctx.bezierCurveTo(sx+ts*x2,sy+ts*y2,sx+ts*x3,sy+ts*y3,sx+ts*x4,sy+ts*y4); ctx.stroke();
    });
    ctx.fillStyle='rgba(255,255,255,.5)';
    [[.2,.14],[.74,.44],[.5,.74]].forEach(([rx,ry])=>{ ctx.fillRect(sx+rx*ts,sy+ry*ts,ts*.05,ts*.05); });
  } else if (type===4||type===8||type===9) {
    const isPC=type===8,isShop=type===9;
    const roofC=isPC?'#c04060':isShop?'#4060c0':'#6070a0';
    const wallC=isPC?'#f0d0da':isShop?'#d0d2f0':'#dcdce8';
    // Roof
    ctx.fillStyle=roofC; ctx.fillRect(sx,sy,ts,ts*.28);
    ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(sx,sy,ts,ts*.06);
    // Wall
    ctx.fillStyle=wallC; ctx.fillRect(sx,sy+ts*.28,ts,ts*.72);
    ctx.fillStyle='rgba(0,0,0,.07)'; ctx.fillRect(sx+ts*.82,sy+ts*.28,ts*.18,ts*.72);
    if(type===4){
      // Windows
      [.1,.52].forEach(wx=>{
        ctx.fillStyle='#b8dff0'; ctx.fillRect(sx+ts*wx,sy+ts*.36,ts*.24,ts*.22);
        ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(sx+ts*wx,sy+ts*.36,ts*.09,ts*.07);
      });
    } else {
      // Door
      ctx.fillStyle='#7a4a20'; ctx.fillRect(sx+ts*.3,sy+ts*.44,ts*.38,ts*.56);
      ctx.fillStyle='rgba(0,0,0,.14)'; ctx.fillRect(sx+ts*.5,sy+ts*.44,ts*.18,ts*.56);
      ctx.fillStyle='#f8d840'; ctx.beginPath(); ctx.arc(sx+ts*.64,sy+ts*.67,ts*.05,0,Math.PI*2); ctx.fill();
      // Sign
      ctx.fillStyle=roofC; ctx.fillRect(sx+ts*.16,sy+ts*.04,ts*.68,ts*.2);
      ctx.fillStyle='#fff'; ctx.font=`bold ${ts*.11}px sans-serif`; ctx.textAlign='center';
      ctx.fillText(isPC?'PKM CENTER':'POKE SHOP',sx+ts*.5,sy+ts*.18);
    }
  } else if (type===6) {
    // Flower patch
    ctx.fillStyle='#58c258'; ctx.fillRect(sx,sy,ts,ts);
    const fls=[{x:.2,y:.42,c:'#f8d020'},{x:.56,y:.24,c:'#ff5090'},{x:.78,y:.58,c:'#ff6020'},{x:.36,y:.68,c:'#ffffff'},{x:.65,y:.8,c:'#cc60ff'}];
    fls.forEach(({x,y,c})=>{
      for(let a=0;a<5;a++){
        ctx.fillStyle=c;
        const ax=sx+x*ts+Math.cos(a*Math.PI*2/5)*ts*.1,ay=sy+y*ts+Math.sin(a*Math.PI*2/5)*ts*.1;
        ctx.beginPath(); ctx.arc(ax,ay,ts*.07,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle='#f8e020'; ctx.beginPath(); ctx.arc(sx+x*ts,sy+y*ts,ts*.05,0,Math.PI*2); ctx.fill();
    });
  } else if (type===5) {
    ctx.fillStyle='#d4b870'; ctx.fillRect(sx,sy,ts,ts);
    ctx.fillStyle='#8a6030'; ctx.fillRect(sx+ts*.44,sy+ts*.4,ts*.12,ts*.6);
    ctx.fillStyle='#c8963a'; ctx.fillRect(sx+ts*.18,sy+ts*.12,ts*.64,ts*.3);
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(sx+ts*.5,sy+ts*.12,ts*.32,ts*.3);
  }

  ctx.strokeStyle='rgba(0,0,0,.07)'; ctx.lineWidth=.5;
  ctx.strokeRect(sx,sy,ts,ts);
}

function drawPlayer(ctx, sx, sy, dir, walkCycle, ts) {
  const cx = sx + ts/2, cy = sy + ts/2;
  const s = ts/40; // scale factor
  const step = Math.floor(walkCycle/2)%2;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(cx,cy+14*s,8*s,3*s,0,0,Math.PI*2); ctx.fill();

  // Legs (animated)
  ctx.fillStyle='#223388';
  if (dir==='down'||dir==='up') {
    ctx.fillRect(cx-7*s+(step?5*s:0),cy+4*s,5*s,10*s);
    ctx.fillRect(cx+2*s-(step?5*s:0),cy+4*s,5*s,10*s);
  } else {
    ctx.fillRect(cx-6*s,cy+4*s,5*s,10*s);
    ctx.fillRect(cx+1*s,cy+4*s,5*s,10*s);
  }

  // Body (jacket)
  ctx.fillStyle='#cc2222';
  ctx.fillRect(cx-8*s,cy-5*s,16*s,11*s);

  // Arms
  ctx.fillStyle='#cc2222';
  if (dir==='left'||dir==='right') {
    ctx.fillStyle='#f5c5a0';
    ctx.fillRect(dir==='left'?cx-11*s:cx+7*s,cy-3*s,4*s,8*s);
  } else {
    ctx.fillRect(cx-11*s,cy-3*s,4*s,8*s);
    ctx.fillRect(cx+7*s,cy-3*s,4*s,8*s);
  }

  // Head
  ctx.fillStyle='#f5c5a0';
  ctx.beginPath(); ctx.arc(cx,cy-12*s,7*s,0,Math.PI*2); ctx.fill();

  // Hat
  ctx.fillStyle='#cc0000';
  ctx.fillRect(cx-8*s,cy-20*s,16*s,7*s);
  ctx.fillRect(cx-10*s,cy-14*s,20*s,2*s); // brim
  // Hat logo
  ctx.fillStyle='#fff';
  ctx.fillRect(cx-2*s,cy-18*s,4*s,3*s);

  // Eyes (face based on direction)
  if (dir==='down') {
    ctx.fillStyle='#333'; ctx.fillRect(cx-4*s,cy-12*s,2*s,2*s); ctx.fillRect(cx+2*s,cy-12*s,2*s,2*s);
  } else if (dir==='up') {
    // back of head, no eyes
  } else {
    ctx.fillStyle='#333'; ctx.fillRect(dir==='left'?cx-5*s:cx+3*s,cy-12*s,2*s,2*s);
  }
}

function drawNPC(ctx, npc, sx, sy, ts) {
  const cx=sx+ts/2, cy=sy+ts/2, s=ts/40;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(cx,cy+14*s,7*s,3*s,0,0,Math.PI*2); ctx.fill();
  // Legs
  ctx.fillStyle='#555';
  ctx.fillRect(cx-6*s,cy+4*s,5*s,10*s);
  ctx.fillRect(cx+1*s,cy+4*s,5*s,10*s);
  // Body
  ctx.fillStyle=npc.color;
  ctx.fillRect(cx-7*s,cy-5*s,14*s,11*s);
  // Head
  ctx.fillStyle='#f5c5a0';
  ctx.beginPath(); ctx.arc(cx,cy-12*s,7*s,0,Math.PI*2); ctx.fill();
  // Hair
  ctx.fillStyle=npc.color;
  ctx.fillRect(cx-8*s,cy-20*s,16*s,9*s);
  // Eyes
  ctx.fillStyle='#333';
  if (npc.dir==='down') { ctx.fillRect(cx-4*s,cy-12*s,2*s,2*s); ctx.fillRect(cx+2*s,cy-12*s,2*s,2*s); }
  // Speech bubble indicator
  ctx.fillStyle='#fff'; ctx.font=`bold ${ts*.2}px sans-serif`; ctx.textAlign='center';
  ctx.fillText('!',cx,cy-22*s);
}

function drawLegendary(ctx, leg, sx, sy, ts) {
  const cx=sx+ts/2, cy=sy+ts/2, s=ts/40;
  const t=Date.now()/1000;
  const pulse=0.85+0.15*Math.sin(t*2.2);
  const r=ts*.38*pulse;
  // Outer aura
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.6);
  grad.addColorStop(0,leg.glow+'cc');
  grad.addColorStop(.5,leg.glow+'55');
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(cx,cy,r*1.6,0,Math.PI*2); ctx.fill();
  // Sprite circle
  ctx.fillStyle=leg.glow+'88';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=leg.glow; ctx.lineWidth=2.5*pulse;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  // Label
  ctx.font=`bold ${ts*.38}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.globalAlpha=pulse;
  ctx.fillText(leg.label,cx,cy);
  ctx.globalAlpha=1;
  // Name
  ctx.font=`bold ${ts*.17}px sans-serif`; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#fff';
  ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.lineWidth=3;
  ctx.strokeText(PDB[leg.dexId].name,cx,sy-4);
  ctx.fillText(PDB[leg.dexId].name,cx,sy-4);
}

function render() {
  getACtx(); // ensure audio ready on interaction
  const app = document.getElementById('app');

  if (G.screen === 'overworld') {
    if (!document.getElementById('ow-canvas')) mountOW(app);
    owUpdateHUD();
    owStart();
    if (_musicTrack !== 'overworld') playMusic('overworld');
  } else {
    owStop();
    app.innerHTML = '';
    const html = G.screen==='title'?renderTitle():G.screen==='name'?renderName():G.screen==='starter'?renderStarter():G.screen==='battle'?renderBattle():G.screen==='shop'?renderShop():G.screen==='party'?renderParty():'';
    app.innerHTML = html;
    bindEvents();
  }
  if (G.modal) showModal();
}

let _dpadDX=0,_dpadDY=0;
function dpadPress(dx,dy) {
  _dpadDX=dx; _dpadDY=dy;
  owTryMove(dx,dy);
  clearTimeout(OW.holdTimer);
  OW.holdTimer=setTimeout(function repeat(){owTryMove(_dpadDX,_dpadDY);OW.holdTimer=setTimeout(repeat,130);},380);
}
function dpadRelease(){clearTimeout(OW.holdTimer);OW.holdTimer=null;}

function renderBattle(){
  const b=G.battle, p=b.party[b.activeIdx], w=b.wild;
  const bg=BATTLE_BG[G.area]||BATTLE_BG['Route 1'];
  const sceneH=Math.round(window.innerHeight*.45);
  const xpPct=()=>{const base=xpForLv(p.lv),next=p.xpNext,cur=p.xp;return next===base?100:Math.max(0,Math.round(((cur-base)/(next-base))*100));};

  const bgStyle=`background:linear-gradient(180deg,${bg.sky} 0%,${bg.sky} ${bg.skyH*100}%,${bg.horizon} ${bg.skyH*100}%,${bg.ground} 100%);`;

  // Scenery elements
  const sunTop=Math.round(bg.skyH*sceneH*.15);
  const sunEl=bg.moon
    ?`<div style="position:absolute;top:${sunTop}px;right:18%;width:26px;height:26px;background:${bg.sun};border-radius:50%;box-shadow:0 0 18px 6px ${bg.sun}88;opacity:.9"></div>`
    :`<div style="position:absolute;top:${sunTop}px;right:15%;width:30px;height:30px;background:${bg.sun};border-radius:50%;box-shadow:0 0 22px 8px ${bg.sun}66"></div>`;
  const starsEl=bg.stars?Array.from({length:14},(_,i)=>`<div style="position:absolute;top:${Math.round(3+Math.sin(i*7.3)*bg.skyH*sceneH*.7)}px;left:${Math.round(4+(i*61)%90)}%;width:2px;height:2px;background:#fff;border-radius:50%;opacity:${.4+.5*(i%3)/3}"></div>`).join(''):'';
  const cloudEl=bg.clouds?`
    <div style="position:absolute;top:${Math.round(bg.skyH*sceneH*.08)}px;left:4%;width:64px;height:18px;background:rgba(255,255,255,.72);border-radius:20px;filter:blur(3px)"></div>
    <div style="position:absolute;top:${Math.round(bg.skyH*sceneH*.08)-4}px;left:8%;width:36px;height:18px;background:rgba(255,255,255,.72);border-radius:20px;filter:blur(3px)"></div>
    <div style="position:absolute;top:${Math.round(bg.skyH*sceneH*.18)}px;left:38%;width:80px;height:20px;background:rgba(255,255,255,.55);border-radius:20px;filter:blur(4px)"></div>
    <div style="position:absolute;top:${Math.round(bg.skyH*sceneH*.18)-5}px;left:44%;width:44px;height:20px;background:rgba(255,255,255,.55);border-radius:20px;filter:blur(3px)"></div>`:'';

  const ui = b.phase==='reading'
    ?`<div class="msg-box" onclick="bAdvMsg()"><div class="msg-text">${b.msgs[b.msgIdx]||''}</div><div class="tap-hint">${b.msgIdx<b.msgs.length-1?'▼ tap':'▼ tap to continue'}</div></div>`
    :b.phase==='menu'
    ?`<div class="menu-wrap"><div style="color:#ccc;font-size:13px;margin-bottom:2px">What will ${p.name} do?</div><div class="menu-grid">
        <div class="menu-btn" onclick="bPhase('fight')"><span style="font-size:20px">⚔️</span>FIGHT</div>

      </div>

        <img src="${spr(p.dexId,false)}" width="${playerSz}" height="${playerSz}" style="image-rendering:pixelated;filter:drop-shadow(-2px 4px 4px rgba(0,0,0,.4))">
      </div>
      ${playerEffEl}
      <!-- Wild info -->
      <div class="battle-wild-info" style="min-width:140px${b.isLegendary?';border:1px solid #f8c800':''}">
        <div style="display:flex;align-items:center;gap:4px"><span class="mon-name">${b.isLegendary?'✨ ':''}${w.name}</span>${sbadge(w.status)}</div>
        <div class="mon-level">Lv.${w.lv}</div>
        <div style="display:flex;align-items:center;gap:4px;margin-top:2px"><span style="color:#555;font-size:10px;font-weight:700">HP</span><div style="flex:1;min-width:90px"><div class="hp-track"><div class="hp-fill" style="width:${hpPct(w)};background:${hpColor(w)}"></div></div></div></div>
        <div style="margin-top:3px">${w.types.map(t=>tbadge(t)).join('')}</div>
      </div>
      <!-- Player info -->
      <div class="battle-player-info" style="min-width:140px">
        <div style="display:flex;align-items:center;gap:4px;justify-content:flex-end"><span class="mon-name">${p.name}</span>${sbadge(p.status)}</div>

    </div>
    <div class="battle-ui">${ui}</div>

}

function navGo(action) {
  switch(action){
    case 'new': G.playerName='';G.party=[];G.bag={pokeballs:15,potions:5,gold:10000};G.area='Route 1';G.caught={};_starterChosen=null;OW.player={tx:7,ty:6,px:0,py:0,dir:'down',moving:false,stepF:0,walkCycle:0,targetTX:7,targetTY:6};G.screen='name';render();break;
    case 'continue': if(loadGame()){G.screen='overworld';render();}break;
    case 'nameNext':{const n=document.getElementById('nameIn');const v=(n&&n.value||G.playerName).trim();if(!v){alert('Please enter your name!');return;}G.playerName=v;G.screen='starter';_starterChosen=null;render();break;}
    case 'startGame': if(!_starterChosen)return;G.party=[createMon(_starterChosen,5)];saveGame();G.screen='overworld';render();break;
  }
}

function chooseStarter(id){_starterChosen=id;render();}

function buyItem(key,cost){
  if((G.bag.gold||0)<cost)return;
  G.bag.gold-=cost;
  G.bag[key]=(G.bag[key]||0)+1;
  SFX.buy(); saveGame(); render();
}

function partyDetail(i){
  const p=G.party[i];
  const xpPct=()=>{const base=xpForLv(p.lv),next=p.xpNext,cur=p.xp;return next===base?100:Math.max(0,Math.round(((cur-base)/(next-base))*100));};
  const sb=(lbl,val)=>{const pct=Math.min(100,Math.round(val/250*100));const c=pct>66?'#44dd44':pct>33?'#f8c800':'#f83800';return`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="color:#aaa;font-size:11px;width:46px">${lbl}</span><div style="flex:1;height:6px;background:#333;border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${c};border-radius:3px"></div></div><span style="color:#fff;font-size:11px;width:28px;text-align:right">${val}</span></div>`;};
  G.modal={content:`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><img src="${spr(p.dexId)}" width="80" height="80" style="image-rendering:pixelated"><div><div style="font-size:22px;font-weight:900">${p.name}</div><div style="color:#aaa;font-size:14px">Level ${p.lv}</div><div style="margin-top:4px">${p.types.map(t=>tbadge(t)).join('')}</div></div></div><div class="gold" style="font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:6px">HP</div><div class="hp-track"><div class="hp-fill" style="width:${hpPct(p)};background:${hpColor(p)}"></div></div><div style="color:#aaa;font-size:11px;text-align:right;margin:2px 0 4px">XP to next: ${xpPct()}%</div><div class="xp-track"><div class="xp-fill" style="width:${xpPct()}%"></div></div><div class="gold" style="font-size:11px;font-weight:800;letter-spacing:1px;margin:12px 0 6px">STATS</div>${sb('Atk',p.stats.atk)}${sb('Def',p.stats.def)}${sb('Sp.Atk',p.stats.spa)}${sb('Sp.Def',p.stats.spd)}${sb('Speed',p.stats.spe)}<div class="gold" style="font-size:11px;font-weight:800;letter-spacing:1px;margin:12px 0 6px">MOVES</div>${p.moves.map(m=>`<div style="background:#141428;border-radius:10px;padding:9px;margin-bottom:5px;display:flex;align-items:center;gap:8px"><div style="width:9px;height:9px;border-radius:50%;background:${TC_COLOR[m.type]||'#888'}"></div><span style="flex:1;font-weight:700;font-size:13px">${m.name}</span><span style="color:#888;font-size:10px">${m.cat}${m.power?` · ${m.power}`:''}</span><span style="color:${m.cur===0?'#f83800':'#aaa'};font-size:11px;font-weight:700">${m.cur}/${m.pp}</span></div>`).join('')}<button class="btn-dark" style="margin-top:10px" onclick="closeModal()">Close</button>`};
  render();
}

// ══════════════════════════════════════════════════════
function bPhase(ph){if(G.battle){G.battle.phase=ph;render();}}

function bPushMsgs(msgs,next){const b=G.battle;b.msgs=msgs;b.msgIdx=0;b.phase='reading';b.pendingPhase=next;render();}

function bAdvMsg(){
  const b=G.battle; if(!b)return;
  if(b.msgIdx<b.msgs.length-1){b.msgIdx++;render();}
  else{ if(b.pendingPhase==='end')bEnd(); else{b.phase=b.pendingPhase;b.msgs=[];b.msgIdx=0;render();} }
}

function bEnd(){
  const b=G.battle;
  if(b.endResult==='caught'){
    const caught=deepClone(b.wild); caught.hp=Math.max(1,Math.floor(b.wild.stats.hp*.3)); caught.status=null;
    G.caught[caught.dexId]=true;
    if(G.party.length<6) G.party.push(caught);
    else G.party=b.party.map(deepClone);
  } else if(b.endResult==='lost'){
    G.party=b.party.map(p=>({...p,hp:Math.max(1,Math.floor(p.stats.hp*.3)),status:null}));
  } else {
    // Fled or defeated wild — mark legendary as gone
    if(b.isLegendary) G.caught[b.wild.dexId]='fled';
    G.party=b.party.map(deepClone);
  }
  saveGame(); G.battle=null; G.screen='overworld';
  playMusic('overworld');
  render();
}

function stgApply(mon,stat,stages){mon.stg[stat]=Math.max(-6,Math.min(6,(mon.stg[stat]||0)+stages));}

function eotDmg(mon){
  const msgs=[];
  if(mon.status==='burn'||mon.status==='poison'){const d=Math.max(1,Math.floor(mon.stats.hp/8));mon.hp=Math.max(0,mon.hp-d);msgs.push(`${mon.name} is hurt by ${mon.status==='burn'?'burn':'poison'}! (${d})`);}
  if(mon.status==='sleep'){mon.stTurns=(mon.stTurns||0)+1;if(mon.stTurns>=3){mon.status=null;mon.stTurns=0;msgs.push(`${mon.name} woke up!`);}}
  if(mon.status==='freeze'&&Math.random()<.2){mon.status=null;msgs.push(`${mon.name} thawed out!`);}
  return msgs;
}

function execMove(atk,def,move,msgs){
  if(atk.status==='paralysis'&&Math.random()<.25){msgs.push(`${atk.name} is paralyzed and can't move!`);return;}
  if(atk.status==='sleep'){msgs.push(`${atk.name} is fast asleep!`);return;}
  if(atk.status==='freeze'){msgs.push(`${atk.name} is frozen solid!`);return;}
  msgs.push(`${atk.name} used ${move.name}!`);
  const mi=atk.moves.findIndex(m=>m.id===move.id); if(mi>=0)atk.moves[mi].cur=Math.max(0,move.cur-1);
  if(move.cat==='Status'){
    const eff=move.eff; if(!eff){msgs.push('But nothing happened!');return;}
    if(eff.k==='stat'){const t=eff.tgt==='foe'?def:atk;stgApply(t,eff.stat,eff.stg);msgs.push(`${t.name}'s ${eff.stat.toUpperCase()} ${eff.stg>0?'rose':'fell'}!`);}
    else if(eff.k==='status'){if(!def.status){def.status=eff.status;msgs.push(`${def.name} fell ${eff.status==='sleep'?'asleep':'into '+eff.status}!`);}else msgs.push('But it had no effect!');}
    return;
  }
  if(!hitCheck(move,atk,def)){msgs.push(`${def.name} avoided the attack!`);return;}
  const r=calcDmg(atk,def,move);
  if(r.tm===0){msgs.push('It had no effect!');return;}
  if(r.crit)msgs.push('A critical hit!');
  if(r.tt)msgs.push(r.tt);
  def.hp=Math.max(0,def.hp-r.dmg); msgs.push(`${def.name} took ${r.dmg} damage!`);
  if(r.drain){atk.hp=Math.min(atk.stats.hp,atk.hp+r.drain);msgs.push(`${atk.name} restored ${r.drain} HP!`);}
  const eff=move.eff;
  if(eff&&def.hp>0){const roll=eff.ch?Math.random()*100<eff.ch:true;if(roll){if(eff.k==='status'&&!def.status){def.status=eff.status;msgs.push(`${def.name} was ${eff.status}!`);}else if(eff.k==='stat'){stgApply(def,eff.stat,eff.stg);msgs.push(`${def.name}'s ${eff.stat.toUpperCase()} fell!`);}}}
}

function pickWildMove(mon){const u=mon.moves.filter(m=>m.cur>0);return(u.length?u:mon.moves)[Math.floor(Math.random()*(u.length||mon.moves.length))];}

function bShowEffect(wildType, playerType) {
  const b=G.battle; if(!b)return;
  b.effect={wildType,playerType}; render();
  setTimeout(()=>{ if(G.battle){G.battle.effect=null;} },420);
}

function bMove(moveId){
  const b=G.battle; if(!b||b.phase!=='fight')return;
  const p=b.party[b.activeIdx], move=p.moves.find(m=>m.id===moveId);
  if(!move||move.cur===0)return;
  SFX.select();
  const msgs=[], w=b.wild;
  execMove(p,w,move,msgs);
  if(move.cat!=='Status'){ SFX.typeHit(move.type); }
  if(w.hp<=0){
    msgs.push(`${w.name} fainted!`);
    const xpGained=Math.max(1,Math.floor((w.xpY*w.lv)/7));
    const gold=Math.floor(w.lv*12);
    msgs.push(`${p.name} gained ${xpGained} XP!`);
    msgs.push(`You found ${gold}g!`);
    p.xp=(p.xp||0)+xpGained; addGold(gold);
    while(p.xp>=p.xpNext&&p.lv<100){
      p.lv++; const db=PDB[p.dexId].bs;
      const ns={hp:calcStat(db.hp,p.lv,true),atk:calcStat(db.atk,p.lv,false),def:calcStat(db.def,p.lv,false),spa:calcStat(db.spa,p.lv,false),spd:calcStat(db.spd,p.lv,false),spe:calcStat(db.spe,p.lv,false)};
      p.hp=Math.min(ns.hp,p.hp+(ns.hp-p.stats.hp)); p.stats=ns; p.xpNext=xpForLv(p.lv+1);
      msgs.push(`${p.name} grew to level ${p.lv}!`); SFX.levelUp();
    }
    b.endResult='win'; SFX.victory(); bPushMsgs(msgs,'end'); return;
  }
  // Wild turn
  const wm=pickWildMove(w); execMove(w,p,wm,msgs);
  if(wm.cat!=='Status'){ SFX.typeHit(wm.type); }
  msgs.push(...eotDmg(p)); msgs.push(...eotDmg(w));
  if(p.hp<=0){
    msgs.push(`${p.name} fainted!`);
    const next=b.party.findIndex((m,i)=>i!==b.activeIdx&&m.hp>0);
    if(next>=0){msgs.push(`Go, ${b.party[next].name}!`);b.activeIdx=next;bPushMsgs(msgs,'menu');}
    else{msgs.push('You have no more Pokemon...');msgs.push('You blacked out!');b.endResult='lost';bPushMsgs(msgs,'end');}
    return;
  }
  if(w.hp<=0){msgs.push(`${w.name} fainted!`);b.endResult='win';bPushMsgs(msgs,'end');return;}
  bPushMsgs(msgs,'menu');
}

function bBag(){bPhase('bag_items');}

function bThrowBall(){
  const b=G.battle;
  if(G.bag.pokeballs<=0){bPushMsgs(["You're out of Poke Balls!"],'menu');return;}
  G.bag.pokeballs--;
  const caught=tryCatch(b.wild);
  if(caught){SFX.catch_();b.endResult='caught';bPushMsgs([`You threw a Poke Ball!`,'...','...','Gotcha! '+b.wild.name+' was caught!'],'end');}
  else bPushMsgs([`You threw a Poke Ball!`,b.wild.name+' broke free!'],'menu');
}

function bUsePotion(){
  const b=G.battle;
  if(!G.bag.potions||G.bag.potions<=0){bPushMsgs(['No Potions left!'],'menu');return;}
  const p=b.party[b.activeIdx];
  if(p.hp<=0){bPushMsgs([`${p.name} has fainted!`],'menu');return;}
  G.bag.potions--;
  const healed=Math.min(30,p.stats.hp-p.hp);
  p.hp=Math.min(p.stats.hp,p.hp+30);
  SFX.heal();
  bPushMsgs([`You used a Potion!`,`${p.name} recovered ${healed} HP!`],'menu');
}

function bRun(){
  const b=G.battle; b.escAttempts=(b.escAttempts||0)+1;
  const p=b.party[b.activeIdx];
  const fled=p.stats.spe>=b.wild.stats.spe||Math.random()*256<Math.floor((p.stats.spe*128)/b.wild.stats.spe)+30*b.escAttempts;
  if(fled){b.endResult='run';SFX.select();bPushMsgs(['Got away safely!'],'end');}
  else bPushMsgs(["Can't escape!"],'menu');
}

function bSwitch(idx){
  const b=G.battle;
  if(idx===b.activeIdx||b.party[idx].hp<=0)return;
  b.activeIdx=idx;bPhase('menu');
}

// ══════════════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════════════
function showModal(){
  const old=document.querySelector('.modal-overlay'); if(old)old.remove();
  if(!G.modal)return;
  const el=document.createElement('div'); el.className='modal-overlay';
  el.innerHTML=`<div class="modal-box">${G.modal.content}</div>`;
  document.getElementById('app').appendChild(el);
}
function closeModal(){G.modal=null;render();}

function bindEvents(){
  const ni=document.getElementById('nameIn');
  if(ni){ni.focus();ni.addEventListener('keydown',e=>{if(e.key==='Enter')navGo('nameNext');});}
}

// ══════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════
render();
</script>
